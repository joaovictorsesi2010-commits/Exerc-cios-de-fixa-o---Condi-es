<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de JavaScript 2</title>

    <script>

        var num = Number(prompt("Diga-me um número "))
        if (num > 0) {
            alert("Este número é positivo")
        } else if (num < 0) {
            alert("Esté número é negativo")
        } else {
            alert("Este número é igual a zero")
        }

    </script>

</head>
