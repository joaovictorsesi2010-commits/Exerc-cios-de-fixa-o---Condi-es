<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de JavaScript 2</title>

    <script>

        var dia = Number(prompt("Qual é o número do dia da semana? (1 a 7)"))
        if (dia == 1) {
            alert("Então o dia cai em uma segunda feira")
        } else if (dia == 2) {
            alert("Então o dia cai em uma terça feira")
        } else if (dia == 3) {
            alert("Então o dia cai em uma quarta feira")
        } else if (dia == 4) {
            alert("Então o dia cai em uma quinta feira")
        } else if (dia == 5) {
            alert("Então o dia cai em uma sexta feira")
        } else if (dia == 6) {
            alert("Então o dia cai em um sábado")
        } else if (dia == 7) {
            alert("Então o dia cai em um domingo")
        } else {
            alert("Esse dia não existe na semana")
        }

    </script>

</head>

</body>
</html>
