<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de JavaScript 2</title>

    <script>

        var peso = Number(prompt("Qual é seu peso em kg? "))
        var altura = Number(prompt("Qual é sua altura em metros? "))

        if (peso / (altura * altura) < 18.5) {
            alert("Você está abaixo do seu peso ideal")
        } else if (peso / (altura * altura) > 18.5 && peso / (altura * altura) < 24.9) {
            alert("Você está no seu peso ideal")
        } else {
            alert("Você tem sobrepeso")
        }

    </script>

</head>
<body>
    
</body>
</html>
