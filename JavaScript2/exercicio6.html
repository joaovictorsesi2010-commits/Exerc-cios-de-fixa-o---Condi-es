<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de JavaScript 2</title>

    <script>

        var valor = Number(prompt("Qual o valor da compra? "))
        if (valor > 100) {
            valor2 = valor - (valor * 0.1)
            alert("O novo valor do produto, com um desconto de 10%, será de " + valor2)
        } else {
            alert("O produto não tem desconto, o preço se mantém " + valor)
        }

    </script>

</head>
