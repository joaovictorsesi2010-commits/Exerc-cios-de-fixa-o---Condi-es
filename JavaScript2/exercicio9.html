    <title>Exercícios de JavaScript 2</title>

    <script>

        var num1 = Number(prompt("Informe um número "))
        var num2 = Number(prompt("Informe outro número "))
        var num3 = Number(prompt("Informe mais um número "))
        
        if (num1 > num2 && num1 > num3) {
            alert("O número " + num1 + " é maior")
        } else if (num2 > num1 && num2 > num3) {
            alert("O número " + num2 + " é maior")
        } else if (num3 > num1 && num3 > num2) {
            alert("O número " + num3 + " é maior")
        }

    </script>
